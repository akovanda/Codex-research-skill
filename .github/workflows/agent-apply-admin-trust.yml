name: agent-apply-admin-trust

on:
  push:
    branches:
      - agent/next-security-correctness-batch

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://registry:registry@127.0.0.1:5432/registry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/next-security-correctness-batch
          fetch-depth: 0
      - name: Verify triggering head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify and apply audited patch
        run: |
          cat .agent/admin_trust/patch.b64.* > /tmp/admin-trust.patch.b64
          echo "834ea0647ce168dc702e459fec4b4b3e83c84ba8d80da1f23777ceea207af522  /tmp/admin-trust.patch.b64" | sha256sum -c -
          base64 -d /tmp/admin-trust.patch.b64 > /tmp/admin-trust.patch
          echo "89f34c0b6bcec1d816707c050f264e20b9983caf2355240246bd7b7cb3776b59  /tmp/admin-trust.patch" | sha256sum -c -
          git apply --check /tmp/admin-trust.patch
          git apply /tmp/admin-trust.patch
          git diff --check
          python -m compileall -q src tests/test_admin_trust_boundaries.py tests/test_security_correctness_regressions.py
      - name: Run focused browser-admin regressions
        run: |
          env -u TEST_DATABASE_URL python -m pytest -q \
            tests/test_admin_trust_boundaries.py \
            tests/test_security_correctness_regressions.py \
            tests/test_contract_snapshots.py \
            tests/test_http_e2e.py
      - name: Run PostgreSQL parity
        run: |
          python -m pytest -q \
            tests/test_postgres_smoke.py \
            tests/test_postgres_deposit_concurrency.py
      - name: Run complete validation
        run: |
          env -u TEST_DATABASE_URL python -m pytest -q
          env -u TEST_DATABASE_URL make rr2-release-check PYTHON=python
      - name: Publish one clean implementation commit
        run: |
          git clean -fdX
          rm -rf .agent
          rm -f .github/workflows/agent-export-next-batch.yml
          rm -f .github/workflows/agent-apply-admin-trust.yml
          git fetch origin master
          git add -A
          git reset --soft origin/master
          git diff --cached --check
          git config user.name "OpenAI Assistant"
          git config user.email "assistant@users.noreply.github.com"
          git commit -m "fix: harden browser admin trust boundaries"
          git push --force origin HEAD:agent/next-security-correctness-batch
