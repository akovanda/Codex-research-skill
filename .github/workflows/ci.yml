name: ci

on:
  push:
  pull_request:

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://registry:registry@127.0.0.1:5432/registry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_postgres_smoke.py

  packaging-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: |
          python -m venv /tmp/research-registry-wheel
          /tmp/research-registry-wheel/bin/python -m pip install --upgrade pip
          /tmp/research-registry-wheel/bin/python -m pip install dist/*.whl
          /tmp/research-registry-wheel/bin/python -c "import importlib.metadata; print(importlib.metadata.version('research-registry'))"
          /tmp/research-registry-wheel/bin/python -m research_registry --help
          CODEX_HOME=/tmp/rr-codex-wheel XDG_CONFIG_HOME=/tmp/rr-config-wheel XDG_DATA_HOME=/tmp/rr-data-wheel /tmp/research-registry-wheel/bin/python -m research_registry up --skip-start --skip-pull --skip-codex-config
          test -e /tmp/rr-codex-wheel/skills/research-capture/SKILL.md
          test -e /tmp/rr-codex-wheel/skills/research-memory-retrieval/SKILL.md
          /tmp/research-registry-wheel/bin/python -m research_registry.local_install --help
          /tmp/research-registry-wheel/bin/python -m research_registry.local_status
      - run: |
          python -m venv /tmp/research-registry-sdist
          /tmp/research-registry-sdist/bin/python -m pip install --upgrade pip
          /tmp/research-registry-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/research-registry-sdist/bin/python -c "import importlib.metadata; print(importlib.metadata.version('research-registry'))"
          /tmp/research-registry-sdist/bin/python -m research_registry --help
          CODEX_HOME=/tmp/rr-codex-sdist XDG_CONFIG_HOME=/tmp/rr-config-sdist XDG_DATA_HOME=/tmp/rr-data-sdist /tmp/research-registry-sdist/bin/python -m research_registry up --skip-start --skip-pull --skip-codex-config
          test -e /tmp/rr-codex-sdist/skills/research-capture/SKILL.md
          test -e /tmp/rr-codex-sdist/skills/research-memory-retrieval/SKILL.md
          /tmp/research-registry-sdist/bin/python -m research_registry.local_install --help
          /tmp/research-registry-sdist/bin/python -m research_registry.local_status
      - run: docker build -t research-registry:test .
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/compose.yaml --env-file deploy/.env config
      - run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("deploy/kubernetes")
          for path in root.glob("*.yaml"):
              content = path.read_text(encoding="utf-8")
              assert "apiVersion:" in content, path
              assert "kind:" in content, path
          PY

  local-installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: RUN_LOCAL_INSTALL_SMOKE=1 python -m pytest -q tests/test_local_install_smoke.py

  shared-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: RUN_SHARED_COMPOSE_SMOKE=1 python -m pytest -q tests/test_shared_compose_smoke.py

  rr2-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make rr2-release-check PYTHON=python

  agent-retained-locator-implementation:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/harden-retained-locators'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/harden-retained-locators
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply and validate implementation
        run: |
          python .agent/apply_locator_security_patch.py
          git diff --check
          python -m pytest -q \
            tests/test_locator_security.py \
            tests/test_v2_contracts.py \
            tests/test_registry.py
          python -m pytest -q
          make rr2-release-check PYTHON=python
      - name: Publish clean implementation commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf .agent
          rm -f .github/workflows/agent-retained-locator-security.yml
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml
          git add -A
          git reset --soft origin/master
          git config user.name "OpenAI Assistant"
          git config user.email "assistant@users.noreply.github.com"
          git commit -m "fix: reject secret-bearing retained locators [locator-result]"
          git push \
            --force-with-lease=refs/heads/agent/harden-retained-locators:${EXPECTED_HEAD} \
            origin HEAD:agent/harden-retained-locators
