name: agent-export-next-batch

on:
  push:
    branches:
      - agent/next-security-correctness-batch
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/research-registry-next-source.tgz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-registry-next-source
          path: /tmp/research-registry-next-source.tgz
          retention-days: 1
          if-no-files-found: error
