services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RESEARCH_REGISTRY_DATA_DIR: /var/lib/research-registry
    ports:
      - "${RESEARCH_REGISTRY_BIND_HOST:-127.0.0.1}:${RESEARCH_REGISTRY_BIND_PORT:-8000}:8000"
    volumes:
      - registry-data:/var/lib/research-registry
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  registry-data:
