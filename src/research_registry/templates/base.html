<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Research Registry{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="backdrop"></div>
    <header class="site-header">
      <a class="brand" href="/v2/search">Research Registry</a>
      <nav aria-label="Primary navigation">
        <a href="/v2/search">Search</a>
        {% if is_admin %}
        <a href="/v2/review">Review</a>
        <a href="/v2/refresh">Refresh</a>
        <a href="/v2/status">Status</a>
        {% else %}
        <a href="/admin/login">Workspace Login</a>
        {% endif %}
        <a href="/">Public Board</a>
      </nav>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
